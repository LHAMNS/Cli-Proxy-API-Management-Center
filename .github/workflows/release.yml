name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build cpa (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            runner: ubuntu-latest
            asset: cpa-linux-x64
          - target: bun-linux-arm64
            runner: ubuntu-latest
            asset: cpa-linux-arm64
          - target: bun-darwin-x64
            runner: macos-latest
            asset: cpa-macos-x64
          - target: bun-darwin-arm64
            runner: macos-latest
            asset: cpa-macos-arm64
          - target: bun-windows-x64
            runner: ubuntu-latest
            asset: cpa-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Compile
        run: bun build src/cli/index.ts --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum cpa-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        run: |
          set -euo pipefail
          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${current_tag}$" | head -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${current_tag}"
          else
            range="${current_tag}"
          fi

          : > release-notes.md
          echo "## Changes" >> release-notes.md
          echo "" >> release-notes.md
          git log --pretty=format:"- %h %s" "${range}" >> release-notes.md
          echo "" >> release-notes.md
          echo "" >> release-notes.md
          echo "## Install" >> release-notes.md
          echo "" >> release-notes.md
          echo 'Download the binary for your platform, mark it executable, and place it on your `$PATH`. Verify with the `SHA256SUMS.txt` file.' >> release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cpa-*
            dist/SHA256SUMS.txt
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
